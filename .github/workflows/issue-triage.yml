# Triage new issues on this (public) repo with Claude: classify, label, find duplicates, check
# whether `dev` already fixed it, point at the likely code, ask for what is missing. Triage ONLY:
# the job has read-only repo access and an allowlisted tool set, and the prompt forbids closing,
# assigning or editing anything but labels. See AGENTS.md "Issue reporting and triage".
#
# Why the gate: the issue body is untrusted text from a public tracker (prompt injection, and every
# run costs money). So it runs automatically only for authors with triage/write/maintain/admin
# access on this repo, which is what `vitops report --submit` from a maintainer's machine is.
# Anyone else's issue waits as `triage:new` until a maintainer adds `triage:run` (only people with
# triage rights can label). The gate asks the collaborator-permission API rather than reading
# `author_association`: an org member whose membership is private is reported there as a
# contributor, so the cheap check silently skipped the maintainer's own issues.
#
# One-time setup: `claude setup-token` locally, then
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN -R getvitops/design-system
# and create the labels the prompt names (see .github/triage/prompt.md).
name: Issue triage

on:
  issues:
    types: [opened, reopened, labeled]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  gate:
    # Other labels (the forms and `vitops report` apply several at creation) need no decision.
    if: github.event.action != 'labeled' || github.event.label.name == 'triage:run'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ACTION: ${{ github.event.action }}
        run: |
          # A maintainer adding `triage:run` is the opt-in; the job's `if` already matched it.
          if [ "$ACTION" = labeled ]; then echo trusted=true >> "$GITHUB_OUTPUT"; exit 0; fi
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$perm" in
            admin|maintain|write|triage) echo trusted=true >> "$GITHUB_OUTPUT" ;;
            *) echo trusted=false >> "$GITHUB_OUTPUT"; echo "author has '$perm' access: waiting for a maintainer to add triage:run" ;;
          esac

  triage:
    needs: gate
    if: needs.gate.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `dev` is where fixes land, so "already fixed?" is answered against it, not `main`.
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 200
          persist-credentials: false

      # Pinned to a commit (v1 is a moving tag and this step holds a secret).
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Our own token, so the action skips its OIDC exchange for a Claude GitHub App token
          # (which needs `id-token: write`) and the job keeps only `contents: read, issues: write`.
          github_token: ${{ github.token }}
          # Only the number is interpolated: the issue's own text is read through `gh`, as data.
          prompt: |
            Triage issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            Read .github/triage/prompt.md first and follow it exactly.
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search issues:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(git log:*)"
