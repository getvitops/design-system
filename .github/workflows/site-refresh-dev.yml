# Reusable "refresh dev from prod" for the `emdash` template. Content lives in
# production (editors work there, with drafts and preview links as the staging
# step); the dev worker's D1 database and media bucket are a disposable copy
# used to rehearse code and schema changes against real data. See AGENTS.md's
# CI/CD section for why content flows prod → dev and never back.
#
# Consumers call this with a pinned major tag, manually and/or on a schedule:
#
#   on: { workflow_dispatch: {}, schedule: [{ cron: '0 6 * * 1' }] }
#   jobs:
#     refresh:
#       uses: getvitops/design-system/.github/workflows/site-refresh-dev.yml@v1
#       secrets: inherit
#
# It runs `scripts/refresh-dev.mjs` (documented there), which refuses to touch
# a database whose id is production's. Media is copied only when the optional
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets exist.
#
# Runs in the `dev` GitHub Environment, never `production`: it needs no
# production approval because it only READS prod, and a refresh that waited on
# an admin would never be run.
name: Site refresh dev

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      DEV_D1_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

# A refresh drops and re-imports every table; two overlapping would interleave.
concurrency:
  group: refresh-dev-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: dev
    env:
      # A step's own `env` is not visible to its own `if`, and `secrets` is not
      # allowed in `if` at all; routing it through job env is the way to branch on it.
      HAS_R2_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # rclone is only for the optional media copy.
      - name: Install rclone
        if: env.HAS_R2_KEYS == 'true'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Refresh dev from prod
        run: node scripts/refresh-dev.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_D1_ID: ${{ secrets.DEV_D1_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
