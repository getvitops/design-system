# Tests, types and generated-artifact freshness, on every push and PR.
#
# Until this existed the only workflow was the docs deploy, so nothing ran the
# test suite on a pull request — and the `docs/` guard below is here because that
# gap already cost something: the conversion-tracking and Google-token commits
# changed the config schema without regenerating the tracked docs bundle, so the
# committed reference (and the copy that ships to consumers in `dist/docs/`)
# described the previous shape of `notifications` and claimed `search notify`
# required a service account. Nothing failed, because nothing was checking.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same ref has nothing to tell us.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build once, then test and verify what was built. Everything downstream `needs` this job and
  # restores its output, so no other job rebuilds the packages.
  #
  # Build comes first because type-aware lint and several test files resolve `@getvitops/*`
  # subpaths through each package's built `dist/` (their `exports` point there, and oxc emits no
  # declarations). A clean clone has no dist; without the build the typecheck fails with TS2307
  # on `@getvitops/utils/color`.
  #
  # It also builds the publishable packages and the docs site, which `vp check`/`vp test run`
  # never do (they exercise source). A break in a package's own `pack`/`build` config (an entry
  # that doesn't resolve, a peer that doesn't satisfy) or in site/'s build (which imports the
  # *installed* @getvitops/astro, not source) would otherwise only surface at release time or on
  # the docs deploy, both further from the change that caused it.
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build every publishable package
        run: vp run build:packages

      # Lint + format + typecheck. No `--fix`: in CI the question is whether the
      # tree is already clean, and a fix would only hide that it wasn't.
      - name: Check
        run: vp check

      - name: Test
        run: vp test run

      # Does a consumer's install actually resolve every subpath, and does
      # the JavaScript actually load? A break in the `exports` map (a
      # typo'd path, a missing dist file, a broken cross-package import) is
      # otherwise invisible until a real install fails on it.
      - name: Verify published-package resolution (publint + attw + runtime import)
        run: vp run verify:packages

      # A ceiling on the bundles @getvitops/core authors itself, in the
      # sizes the docs' own reasoning already depends on.
      - name: Verify bundle-size budget
        run: vp run verify:bundle-size

      - name: Build the docs site
        run: vp run docs:build

      # Hand the build to the downstream jobs. `dist/` alone is not enough: on a fresh runner vp has
      # no record that `build:packages` ever ran, so it would rebuild even with `dist/` present. The
      # task cache holds each task's fingerprint, so restoring it beside the outputs turns the
      # downstream `dependsOn` builds into cache hits.
      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          retention-days: 1
          include-hidden-files: true
          path: |
            packages/*/dist/
            packages/generator/assets/
            site/dist/
            node_modules/.vite/task-cache/

  # Install-and-build what a client gets from `vp create @getvitops:<template>`,
  # against THIS checkout's `@getvitops/*`, published to a throwaway Verdaccio
  # registry, rather than the last release (a template's deps are `latest`, so a
  # plain scaffold would test nothing new).
  # Nothing else here installs a template the way a client does: it is the one
  # job that fails when the template, `@getvitops/emdash`'s plugin surface, or a
  # bump of EmDash / Vite+ breaks a fresh project. See scripts/scaffold-check.mjs
  # for exactly where it differs from a real `vp create`. Registry-dependent, so
  # it is a separate job rather than part of `build-test`.
  scaffold:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [emdash, static]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Scaffold and build the ${{ matrix.template }} template
        run: vp run verify:scaffold:${{ matrix.template }}

  # `docs/` and `DESIGN.md` are generated but TRACKED, which makes them the one
  # class of artifact that can silently disagree with its source. Everything else
  # generated lands in gitignored `dist/`, where it is rebuilt on demand and can't
  # go stale in the repository.
  #
  # Both regenerators are idempotent (verified), so this only fails when the
  # committed copy genuinely differs from what the current source produces. The
  # fix is always to run the named task and commit the result.
  generated:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # Writes dist/ (gitignored) and the tracked docs/ mirror.
      - name: Regenerate the docs bundle
        run: vp run build:theme

      # Writes the tracked root DESIGN.md.
      - name: Regenerate DESIGN.md
        run: vp run build:design

      - name: Generated artifacts are up to date
        run: |
          if ! git diff --quiet -- docs/ DESIGN.md; then
            echo '::error::Generated artifacts are stale. Run `vp run build:theme` and `vp run build:design`, then commit.'
            git --no-pager diff --stat -- docs/ DESIGN.md
            git --no-pager diff -- docs/ DESIGN.md
            exit 1
          fi
          echo 'docs/ and DESIGN.md match their source.'

      # A doc the generator emits that the docs site does not carry is invisible
      # to readers while `generateDocs` reports success — `sync-reference.mjs`
      # throws on that, and this is where it gets caught before a deploy.
      - name: The docs site carries every emitted doc
        run: vp run docs:sync

  # The one e2e layer in the repo: real Chromium, scripting disabled, against
  # site/ — verifying the tier-2 `<wc-*>` no-JS-fallback promise
  # (AGENTS.md's "Web components" section) that nothing checked before this.
  # Separate job, not folded into `build-test`: it needs a browser binary the unit
  # test job has no reason to carry.
  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # --with-deps needs the runner's system libraries a plain `npx playwright
      # install` skips; ubuntu-latest has sudo, so this works here even though
      # it doesn't in every sandbox.
      - name: Install Playwright's Chromium
        run: vp exec --filter site playwright install --with-deps chromium

      - name: No-JS fallback e2e
        run: vp run docs:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 14

  # End to end, whole toolchain: scaffold the emdash template against THIS checkout (packed into a
  # throwaway Verdaccio, like `scaffold`), overlay a test-only seed (a page with every block and a
  # `blocks`-field page, packages/create/e2e/), build it, serve the prerendered output with its
  # `_headers` applied and run `vitops audit` over it. See scripts/e2e-audit.mjs.
  #
  # `--warn` means findings are REPORTED (job summary line + the uploaded report) but do not fail
  # the build. To make the audit a gate, delete `-- --warn` below once the findings in the report
  # are fixed or the budgets are tuned; the script then exits with the audit's own code. Setup
  # failures (install, seed validation, build) fail the job either way. It never pauses here:
  # `--pause` is refused when CI is set.
  e2e-audit:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # The browser binary is cached by Playwright version: the download is the slow part, the
      # system libraries (--with-deps) are not cacheable and are installed every run.
      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright's Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: vp exec playwright install-deps chromium

      - name: Scaffold, build and audit
        run: vp run verify:e2e -- --warn

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-audit-report
          path: .vitops/e2e-audit/
          retention-days: 14
