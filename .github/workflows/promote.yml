# Promote dev → main for this repo. Run manually after reviewing the dev docs
# site (dev.docs.vitops.ca). See site-promote.yml for what this does and why.
name: Promote dev → main

on:
  workflow_dispatch:

jobs:
  promote:
    # A reusable workflow can only use permissions its caller grants, and this repo's default
    # token is read-only, so without this the run fails at startup.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/site-promote.yml
    secrets: inherit
