# SUPERSEDED by deploy-dev.yml / deploy-prod.yml (Cloudflare Workers static
# assets, via site/wrangler.jsonc) — see AGENTS.md's CI/CD section for why:
# docs.vitops.ca now dogfoods the same deploy path every scaffolded client
# site uses, which GitHub Pages never exercised.
#
# Kept as a MANUAL fallback only — `workflow_dispatch`, no `push` trigger.
# Both workflows publish the same custom domain (docs.vitops.ca); running both
# on every push to `main` would race two different platforms claiming the same
# hostname. Delete this file entirely once the Cloudflare prod deploy has
# succeeded at least once (see AGENTS.md's CI/CD section, "Live proof").
name: Deploy docs (GitHub Pages, fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it — a half-applied Pages
# deployment is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup

      # `docs:build` pulls in the whole chain it needs: build:core →
      # build:generator → build:utils → build:vite-plugin → build:astro, plus
      # docs:sync, which regenerates the Reference section from the generator so
      # the published site can't describe output the toolchain doesn't emit.
      - run: pnpm exec vp run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
