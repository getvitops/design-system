name: Bug
description: The toolchain produced an error or wrong output.
title: '[bug] '
labels: [bug, triage:new]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is public. Leave out client names, domains, contact details and tokens.
  - type: textarea
    id: toolchain-version
    attributes:
      label: Toolchain version
      description: Installed `@getvitops/*` versions (`vitops report` fills this in).
      placeholder: '- @getvitops/cli 9.0.0'
    validations:
      required: true
  - type: dropdown
    id: affected-package
    attributes:
      label: Affected package
      options: [core, generator, utils, cli, vite, astro, config, create, skills, emdash, Not sure]
    validations:
      required: true
  - type: dropdown
    id: output-format
    attributes:
      label: Output format
      options: [css, bricks, tailwind, design, Not applicable]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [EmDash, Static Astro, Bricks / WordPress, Other]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest config or markup that shows it, with client content removed.
  - type: dropdown
    id: reported-by
    attributes:
      label: Reported by
      options: [human, agent]
    validations:
      required: true
