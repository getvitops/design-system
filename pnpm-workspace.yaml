packages:
  - 'packages/*'
  - 'site'
# Single source of truth for dependency versions. Every package.json references
# these via the `catalog:` protocol so a version is bumped in exactly one place.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@astrojs/check': ^0.9.12
  '@astrojs/cloudflare': ^14.4.4
  '@astrojs/sitemap': ^3.7.4
  '@changesets/cli': ^3.0.3
  '@emdash-cms/cloudflare': ^1.4.0
  '@iconify-json/fa7-solid': ^1.2.5
  '@iconify-json/lucide': ^1.2.151
  '@iconify-json/material-symbols': ^1.2.97
  '@iconify-json/ph': ^1.2.2
  '@iconify/types': ^2.0.0
  '@iconify/utils': ^3.1.7
  '@lit-labs/signals': ^0.3.0
  '@oddbird/css-anchor-positioning': ^0.10.2
  '@oddbird/popover-polyfill': ^0.7.3
  '@playwright/test': ^1.64.1
  # Pinned exact, not ^: vite-plus bundles vitest@4.1.9 internally and asserts
  # the coverage provider matches it exactly — a caret range resolved
  # 4.1.10 here and vite-plus refused to start rather than run mixed versions.
  '@vitest/coverage-v8': 5.1.0
  '@tailwindcss/vite': ^4.3.4
  '@types/node': ^26.6.6
  '@webcomponents/template-shadowroot': ^0.2.1
  '@webcomponents/webcomponentsjs': ^2.8.0
  astro: ^7.4.5
  astro-icon: ^1.2.0
  baseline-status: ^1.2.0
  colorjs.io: ^0.7.1
  construct-style-sheets-polyfill: ^3.1.0
  cssnano: ^9.9.0
  emdash: ^1.4.0
  happy-dom: ^21.0.4
  invokers-polyfill: ^1.0.4
  parse5: ^8.1.0
  lightningcss: ^1.33.0
  lit: ^3.3.3
  minify-html-literals: ^1.3.5
  png-to-ico: ^3.0.2
  postcss: ^8.5.32
  postcss-lit: ^1.4.1
  publint: ^0.3.25
  scroll-timeline-polyfill: ^1.1.0
  sharp: ^0.35.5
  tailwindcss: ^4.3.4
  temporal-polyfill: ^1.0.7
  typescript: ^7.0.2
  vite: ^8.3.5
  # Pinned exact, not ^, for the same reason as @vitest/coverage-v8 above: vite-plus
  # bundles this version internally and refuses to start on a mismatch.
  vitest: 5.1.0
  vite-plus: ^1.5.0
  wrangler: ^4.157.0
  zod: ^4.6.7
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  lightningcss: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.1.2
