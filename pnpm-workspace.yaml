packages:
  - 'packages/*'
  - 'site'
# Single source of truth for dependency versions. Every package.json references
# these via the `catalog:` protocol so a version is bumped in exactly one place.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@astrojs/check': ^0.9.7
  '@astrojs/cloudflare': ^14.0.0
  '@astrojs/sitemap': ^3.7.3
  '@changesets/cli': ^2.27.0
  '@emdash-cms/cloudflare': ^1.0.1
  '@iconify-json/fa7-solid': ^1.2.5
  '@iconify-json/lucide': ^1.2.121
  '@iconify-json/material-symbols': ^1.2.88
  '@iconify-json/ph': ^1.2.2
  '@iconify/types': ^2.0.0
  '@iconify/utils': ^2.3.0
  '@lit-labs/signals': ^0.3.0
  '@oddbird/css-anchor-positioning': ^0.9.0
  '@oddbird/popover-polyfill': ^0.7.0
  '@playwright/test': ^1.62.1
  # Pinned exact, not ^: vite-plus bundles vitest@5.0.1 internally and asserts
  # the coverage provider matches it exactly — a caret range resolved
  # 4.1.10 here and vite-plus refused to start rather than run mixed versions
  # (verified against vite-plus 0.2.1, which bundled vitest 4.1.9; vite-plus
  # 1.0.0 moved to vitest 5.0.1 — bumped in lockstep with the vite-plus bump
  # below, not to the newer 5.0.2, to match what vite-plus 1.0.0 actually
  # bundles).
  '@vitest/coverage-v8': 5.0.1
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^25.9.3
  '@webcomponents/template-shadowroot': ^0.2.1
  '@webcomponents/webcomponentsjs': ^2.8.0
  astro: ^7.1.2
  astro-icon: ^1.1.5
  baseline-status: ^1.1.1
  colorjs.io: ^0.5.2
  construct-style-sheets-polyfill: ^3.1.0
  cssnano: ^8.0.5
  emdash: ^1.0.1
  happy-dom: ^20.0.0
  invokers-polyfill: ^1.0.3
  parse5: ^7.3.0
  lightningcss: ^1.32.0
  lit: ^3.3.3
  minify-html-literals: ^1.3.5
  png-to-ico: ^3.0.2
  postcss: ^8.5.26
  postcss-lit: ^1.4.1
  publint: ^0.3.23
  scroll-timeline-polyfill: ^1.1.0
  sharp: ^0.35.3
  tailwindcss: ^4.3.3
  temporal-polyfill: ^1.0.1
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  # Pinned exact, not ^, for the same reason as @vitest/coverage-v8 above: vite-plus
  # bundles this version internally and refuses to start on a mismatch.
  vitest: 5.0.1
  vite-plus: 1.0.0
  wrangler: ^4.111.0
  zod: ^4.6.5
  '@zod/mini': ^4.6.5
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  lightningcss: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.1.2
  - '@emdash-cms/admin@1.0.1'
  - '@emdash-cms/auth@1.0.1'
  - '@emdash-cms/blocks@1.0.1'
  - '@emdash-cms/cloudflare@1.0.1'
  - '@emdash-cms/gutenberg-to-portable-text@1.0.1'
  - '@emdash-cms/plugin-types@0.5.0'
  - '@emdash-cms/registry-client@0.7.0'
  - '@emdash-cms/registry-lexicons@0.7.0'
  - '@emdash-cms/registry-verification@0.3.3'
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - emdash@1.0.1
  - vite-plus@1.0.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
