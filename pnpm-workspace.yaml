packages:
  - 'packages/*'
  - 'site'
# Single source of truth for dependency versions. Every package.json references
# these via the `catalog:` protocol so a version is bumped in exactly one place.
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@astrojs/check': ^0.9.7
  '@astrojs/cloudflare': ^14.2.5
  '@astrojs/sitemap': ^3.7.3
  '@changesets/cli': ^3.0.1
  '@emdash-cms/cloudflare': ^0.35.0
  '@iconify-json/fa7-solid': ^1.2.5
  '@iconify-json/lucide': ^1.2.126
  '@iconify-json/material-symbols': ^1.2.89
  '@iconify-json/ph': ^1.2.2
  '@iconify/types': ^2.0.0
  '@iconify/utils': ^3.1.4
  '@lit-labs/signals': ^0.3.0
  '@oddbird/css-anchor-positioning': ^0.10.2
  '@oddbird/popover-polyfill': ^0.7.2
  '@playwright/test': ^1.62.1
  # Pinned exact, not ^: vite-plus bundles vitest@4.1.9 internally and asserts
  # the coverage provider matches it exactly — a caret range resolved
  # 4.1.10 here and vite-plus refused to start rather than run mixed versions.
  '@vitest/coverage-v8': 4.1.11
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^25.9.3
  '@webcomponents/template-shadowroot': ^0.2.1
  '@webcomponents/webcomponentsjs': ^2.8.0
  astro: ^7.2.7
  astro-icon: ^1.2.0
  baseline-status: ^1.2.0
  colorjs.io: ^0.7.1
  construct-style-sheets-polyfill: ^3.1.0
  cssnano: ^8.0.9
  emdash: ^0.35.0
  happy-dom: ^20.11.6
  invokers-polyfill: ^1.0.4
  parse5: ^8.0.1
  lightningcss: ^1.33.0
  lit: ^3.3.3
  minify-html-literals: ^1.3.5
  png-to-ico: ^3.0.2
  postcss: ^8.5.26
  postcss-lit: ^1.4.1
  publint: ^0.3.24
  scroll-timeline-polyfill: ^1.1.0
  sharp: ^0.35.4
  tailwindcss: ^4.3.3
  temporal-polyfill: ^1.0.4
  typescript: ^7.0.2
  vite: ^8.2.2
  # Pinned exact, not ^, for the same reason as @vitest/coverage-v8 above: vite-plus
  # bundles this version internally and refuses to start on a mismatch.
  vitest: 4.1.11
  vite-plus: ^0.3.0
  wrangler: ^4.126.0
  zod: ^4.1.13
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  lightningcss: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - astro@7.1.2
