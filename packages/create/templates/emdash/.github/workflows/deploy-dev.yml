# Deploys the `dev` branch to the isolated dev worker (<name>-dev, and
# dev.<domain> if a custom domain is configured in wrangler.jsonc).
# `dev` is the integration branch — every push here refreshes the review site.
# Promote to production with the "Promote dev → main" workflow (promote.yml).
#
# Deploys via the vitops toolchain's reusable EmDash deploy workflow — see
# https://github.com/getvitops/design-system/blob/main/.github/workflows/site-deploy-emdash.yml
# for what it does. Pinned to @v1 so a fix there reaches this repo without a
# manual re-paste; bump the tag deliberately if you want to pick up a change.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers + D1 + R2 edit on this account
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
#   DEV_D1_ID              — id from `wrangler d1 create <name>-dev`
#                            (without it the build script hard-fails, on purpose)
name: Deploy dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    uses: getvitops/design-system/.github/workflows/site-deploy-emdash.yml@v1
    with:
      environment: dev
      is-dev: true
      # Set this to your dev worker's URL (or dev.<domain>) once known, so a
      # bad migration fails the deploy instead of surfacing to the first
      # visitor — see the reusable workflow's docblock.
      health-check-url: ''
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_ID: ${{ secrets.DEV_D1_ID }}
