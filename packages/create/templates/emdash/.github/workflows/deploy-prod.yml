# Deploys `main` to production.
# `main` should be branch-protected — it then only advances via the Promote
# workflow (promote.yml), so a push here always represents promoted code. The
# `production` GitHub Environment (set up by `vitops setup repo`) has
# required reviewers restricted to admins, so this PAUSES for approval before
# deploying.
#
# Deploys via the vitops toolchain's reusable EmDash deploy workflow — see
# https://github.com/getvitops/design-system/blob/main/.github/workflows/site-deploy-emdash.yml
#
# Also runs on a `repository_dispatch` of type `emdash-publish`: pages are
# prerendered, so a publish in the EmDash admin only goes live after a rebuild,
# and an EmDash `content:afterPublish` hook POSTs that event (.agents/skills/emdash-content-and-deploys,
# "Publish-triggered rebuilds"). A dispatch runs this file from the DEFAULT branch
# (`dev`), so `ref` pins the build to `main` — production's code, not dev's. It
# still goes through the `production` environment, so it still waits for the
# reviewers' approval; relax that rule if editors' publishes should go live
# unattended.
#
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy prod

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [emdash-publish]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: getvitops/design-system/.github/workflows/site-deploy-emdash.yml@v1
    with:
      environment: production
      is-dev: false
      ref: ${{ github.event_name == 'repository_dispatch' && 'main' || '' }}
      # Set this to your production URL once known.
      health-check-url: ''
      # Opt-in: replay dev's collections and fields onto production (additions only) after the
      # migrations and before the code deploys, behind this job's production approval. Removals and
      # changed definitions are reported, never applied. Restricted to a push so a content-publish
      # rebuild never touches the schema. Off until you set the repository variables
      # SCHEMA_FROM_URL (your dev site) and SCHEMA_TO_URL (this site), plus the two tokens below.
      schema-from-url: ${{ github.event_name == 'push' && vars.SCHEMA_FROM_URL || '' }}
      schema-to-url: ${{ vars.SCHEMA_TO_URL || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMDASH_TOKEN_FROM: ${{ secrets.EMDASH_TOKEN_DEV }}
      EMDASH_TOKEN_TO: ${{ secrets.EMDASH_TOKEN_PROD }}
