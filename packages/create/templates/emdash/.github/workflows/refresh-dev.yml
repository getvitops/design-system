# Refresh the dev site's database and media from PRODUCTION.
#
# Content is edited in prod (drafts + preview links are the staging step); dev
# holds a disposable copy so code and schema changes can be rehearsed against
# real data. This only ever copies prod → dev, and refuses to run against a
# database whose id is production's. Run it before testing a schema change, or
# let the weekly schedule keep dev from drifting.
#
# Deploys via the vitops toolchain's reusable workflow — see
# https://github.com/getvitops/design-system/blob/main/.github/workflows/site-refresh-dev.yml
#
# Required: the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / DEV_D1_ID
# secrets Deploy dev uses. Optional, for copying media as well:
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — an R2 API token (S3 credentials)
name: Refresh dev from prod

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  refresh:
    uses: getvitops/design-system/.github/workflows/site-refresh-dev.yml@v1
    secrets: inherit
