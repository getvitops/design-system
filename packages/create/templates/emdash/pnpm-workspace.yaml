# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  better-sqlite3: false
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (toolchain exempt)
# and no non-registry transitive sources.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@getvitops/*'
  - emdash
  - '@emdash-cms/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
blockExoticSubdeps: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
