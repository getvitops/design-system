# Deploys `main` to production.
# `main` should be branch-protected — it then only advances via the Promote
# workflow (promote.yml), so a push here always represents promoted code. The
# `production` GitHub Environment (set up by `scripts/init-github.mjs`) has
# required reviewers restricted to admins, so this PAUSES for approval before
# deploying.
#
# Deploys via the vitops toolchain's reusable static-site deploy workflow — see
# https://github.com/getvitops/design-system/blob/main/.github/workflows/site-deploy-static.yml
#
# Required repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: getvitops/design-system/.github/workflows/site-deploy-static.yml@v1
    with:
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
