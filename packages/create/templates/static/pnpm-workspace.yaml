# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: nothing installs within 3 days of its publish
# (toolchain exempt), and no non-registry transitive sources.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@getvitops/*'
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
blockExoticSubdeps: true
