# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# Supply-chain hardening: nothing installs within 3 days of its publish, and no non-registry
# transitive sources. Only our own lockstep `@getvitops/*` is exempt. Do NOT exempt a third-party
# toolchain: an exempt package's exact pins are not exempt (vite-plus pins `@oxc-project/*`
# exactly), so the install fails whenever one is fresher than the window. A security patch may be
# admitted with an exact `name@x.y.z` line and a dated reason; remove it once it matures.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@getvitops/*'
blockExoticSubdeps: true
